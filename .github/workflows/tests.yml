name: tests

# The contract suite runs without exojax: the package imports with no data installed, the $VULCAN_FORWARD_DATA contract
# fails loudly instead of guessing, the molecule table is injectable, and planet geometry is required, the properties
# the two consumer repos build on. vulcan3 is installed from its main branch, so the normal-tier chemistry tests (batch,
# queue) run too; the RT physics against real tables runs locally, where exojax and the data are installed.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Format, lint, types, spelling
        run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: check-size-limits
      - name: Size limits
        run: python3 tools/check_size_limits.py

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    # Single-threaded XLA CPU, as the local suite runs: the lane-independence checks are bitwise, and multi-threaded
    # Eigen reductions are not.
    env:
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      OMP_NUM_THREADS: "1"
    strategy:
      matrix:
        # pyproject.toml declares Python 3.10 as the floor; this matrix keeps that claim verified.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # --no-deps for the package itself: the contract must hold without the heavy tree (exojax is absent, so the
      # modules that need it skip via find_spec). jax, numpy and h5py are installed so the ckd, interp_map, exomolop and
      # params_from_vector tests run. vulcan3 comes from its main branch with --no-deps and its own deps listed here,
      # exogibbs --no-deps plus pandas as vulcan3's CI installs them; jax is pinned to the version vulcan3's tolerances
      # are calibrated on, and numpy<2 matches the root workspace env.
      - name: Install (no exojax)
        run: |
          pip install pytest "numpy<2" "jax==0.6.2" h5py scipy pyyaml pandas
          pip install --no-deps "exogibbs==0.6.0"
          pip install --no-deps "vulcan3 @ git+https://github.com/imalsky/VULCAN3.git@main"
          pip install --no-deps -e .
      # The normal tier. The full tier (VULCAN_FORWARD_RUN_FULL=1) runs locally: its gradient tests peak near 21 GB,
      # above a hosted runner's 16 GB, and three convergence-scale comparisons calibrated on the development
      # workstation failed on the runner's CPU.
      - name: Run contract tests
        run: python -m pytest tests -q -ra

  # The same normal tier with exojax installed and no data tree: the RT runs on tests/test_rt_miniature.py's small tables.
  # The 80 % floor is pyproject's fail_under, and nothing is omitted; the real-table comparisons skip here.
  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (exojax, no data)
        run: |
          pip install pytest pytest-cov "numpy<2" "jax==0.6.2" h5py scipy pyyaml pandas "exojax==2.6.0" "radis<0.17"
          pip install --no-deps "exogibbs==0.6.0"
          pip install --no-deps "vulcan3 @ git+https://github.com/imalsky/VULCAN3.git@main"
          pip install --no-deps -e .
      - name: Run the normal tier, with the coverage floor
        run: python -m pytest tests -q -ra --cov --cov-report=term
