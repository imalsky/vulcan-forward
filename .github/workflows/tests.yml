name: tests

# The contract suite is deliberately dependency-light (no jax, no exojax, no
# vulcan_jax): it pins that the package imports with no data installed, that the
# $VULCAN_FORWARD_DATA contract fails loudly instead of guessing, that the
# molecule table is injectable, and that planet geometry is required. Those are
# the properties that made the 2026-07-29 extraction worth doing, and they are
# what the two consumer repos build on -- so they are worth checking on every
# push. The physics itself is validated by the consumers' suites.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # requires-python = ">=3.10"; keep the floor claim verified.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # --no-deps for the package itself: the point of this suite is that the
      # contract holds WITHOUT the heavy tree (exojax pins numpy<2, so it is
      # deliberately absent and its two tests importorskip). jax + numpy ARE
      # installed so the params_from_vector test runs: it pins the positional
      # [lnZ, c_o, lnKzz] + T-P theta layout that both consumers unpack by
      # fixed index, which is the contract most expensive to break silently.
      - name: Install (contract only, no exojax)
        run: |
          pip install pytest numpy "jax>=0.6" h5py
          pip install --no-deps -e .
      - name: Run contract tests
        run: python -m pytest tests -q -ra
