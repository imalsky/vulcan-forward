name: tests

# The contract suite is deliberately dependency-light (no exojax, no
# vulcan_jax): it pins that the package imports with no data installed, that the
# $VULCAN_FORWARD_DATA contract fails loudly instead of guessing, that the
# molecule table is injectable, and that planet geometry is required -- the
# properties the two consumer repos build on. The physics runs locally, where
# the RT stack and the data are installed.
on:
  push:
    branches: [main, speed]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # requires-python = ">=3.10"; keep the floor claim verified.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # --no-deps for the package itself: the contract must hold WITHOUT the
      # heavy tree (exojax pins numpy<2, so it is absent and the modules that
      # need it skip via find_spec). jax + numpy + h5py ARE installed so the
      # ckd, interp_map, exomolop and params_from_vector tests run.
      - name: Install (contract only, no exojax)
        run: |
          pip install pytest numpy "jax>=0.6" h5py
          pip install --no-deps -e .
      - name: Run contract tests
        run: python -m pytest tests -q -ra
