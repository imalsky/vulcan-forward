name: tests

# The contract suite runs without exojax: it pins that the package imports
# with no data installed, that the $VULCAN_FORWARD_DATA contract fails loudly
# instead of guessing, that the molecule table is injectable, and that planet
# geometry is required -- the properties the two consumer repos build on.
# vulcan_jax IS installed (its main branch), so the normal-tier chemistry
# tests (batch, queue) run too; the RT physics runs locally, where exojax and
# the data are installed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Single-threaded XLA CPU, as the local suite runs: the lane-independence
    # checks are bitwise, and multi-threaded Eigen reductions are not.
    env:
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      OMP_NUM_THREADS: "1"
    strategy:
      matrix:
        # requires-python = ">=3.10"; keep the floor claim verified.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # --no-deps for the package itself: the contract must hold WITHOUT the
      # heavy tree (exojax is absent, so the modules that need it skip via
      # find_spec). jax + numpy + h5py ARE installed so the
      # ckd, interp_map, exomolop and params_from_vector tests run. vulcan-jax
      # comes from its main branch with --no-deps, its own deps listed here,
      # and exogibbs --no-deps plus pandas as VULCAN-JAX's CI installs them;
      # jax is pinned to the version VULCAN-JAX's tolerances are calibrated on.
      # numpy<2 as in the root workspace env.
      - name: Install (no exojax)
        run: |
          pip install pytest "numpy<2" "jax==0.6.2" h5py scipy pyyaml pandas
          pip install --no-deps "exogibbs==0.6.0"
          pip install --no-deps "vulcan-jax @ git+https://github.com/imalsky/jax-vulcan.git@main"
          pip install --no-deps -e .
      # The normal tier. The full tier (VULCAN_FORWARD_RUN_FULL=1) runs
      # locally: its gradient tests peak near 21 GB, above a hosted runner's
      # 16 GB, and three convergence-scale comparisons calibrated on daw
      # failed on the runner's CPU (run 36254404095).
      - name: Run contract tests
        run: python -m pytest tests -q -ra
