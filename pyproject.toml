[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-forward"
dynamic = ["version"]
description = "Shared VULCAN-JAX to ExoJAX forward-model engine (chemistry + radiative transfer)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "jax>=0.6.2",
    # exojax==2.2.3 pinned: the inverse-square gravity workaround and one
    # compatibility-shim import (exojax.database.contdb) depend on it. It caps
    # numpy<2, which this package keeps out of vulcan-jax.
    "exojax==2.2.3",
    # >=0.17.0: vulcan_jax.conv_normal (ConvDiag's certificate) and
    # validate_overrides (the cfg_overrides check).
    "vulcan-jax>=0.17.0",
    # Core, not an extra: every consumer reads ExoMolOP HDF5 k-tables; the
    # import stays function-local, so the package imports without data.
    "h5py>=3.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/imalsky/vulcan-forward"
Repository = "https://github.com/imalsky/vulcan-forward"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.11", "build>=1.2", "twine>=5"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "vulcan_forward._version.__version__" }

# Classic rule set, pinned: import sorting would reorder the import-order test
# preambles, and E402 must stay for the noqa comments.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# vulcan_chem must set the VULCAN_JAX_* import-frozen env vars and jax x64
# before importing jax/vulcan_jax, so its module-level imports legitimately
# follow executable statements.
[tool.ruff.lint.per-file-ignores]
"src/vulcan_forward/vulcan_chem.py" = ["E402"]
"src/vulcan_forward/exojax_rt.py" = ["E402"]

[tool.ruff]
line-length = 100
