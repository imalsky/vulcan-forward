[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-forward"
dynamic = ["version"]
description = "Shared VULCAN-JAX to ExoJAX forward-model engine (chemistry + radiative transfer)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "jax>=0.6.2",
    # Exact pin: the RT is verified against petitRADTRANS on this version, and
    # a new version moves the spectra.
    "exojax==2.6.0",
    # exojax needs radis; radis 0.17.1 requires vaex-core on Python < 3.13,
    # which has no wheel past 3.10 and fails to build, so 3.11 and 3.12
    # installs break. 0.16.3 requires vaex only below 3.11.
    "radis<0.17",
    # >=0.17.0: vulcan_jax.conv_normal (ConvDiag's certificate) and
    # validate_overrides (the cfg_overrides check).
    "vulcan-jax>=0.17.0",
    # Core, not an extra: every consumer reads ExoMolOP HDF5 k-tables; the
    # import stays function-local, so the package imports without data.
    "h5py>=3.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/imalsky/vulcan-forward"
Repository = "https://github.com/imalsky/vulcan-forward"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.11", "build>=1.2", "twine>=5"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "vulcan_forward._version.__version__" }

# Classic rule set, pinned: import sorting would reorder the import-order test
# preambles, and E402 must stay for the noqa comments.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# exojax_rt enables jax x64 before its exojax imports, so its module-level
# imports follow a statement (vulcan_chem marks its two with noqa).
[tool.ruff.lint.per-file-ignores]
"src/vulcan_forward/exojax_rt.py" = ["E402"]

[tool.ruff]
line-length = 100
